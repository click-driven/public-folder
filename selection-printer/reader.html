<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Selection Reader</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      line-height: 1.8;
      max-width: 750px;
      margin: 3rem auto;
      padding: 0 1.5rem;
      color: #222;
      background: #fafafa;
    }
    #content {
      white-space: pre-wrap;
      font-size: 1.25rem;
    }
    .controls {
      margin-bottom: 2rem;
      display: flex;
      gap: 10px;
    }
    button {
      padding: 8px 16px;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="controls">
    <button id="speak-btn">🔊 Read Aloud</button>
    <button id="print-btn">🖨️ Print Page</button>
  </div>
  <div id="content">Loading text...</div>
  <script src="reader.js"></script>
</body>
</html>
